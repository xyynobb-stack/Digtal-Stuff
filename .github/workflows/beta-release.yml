name: Beta Release

# Produces a downloadable Windows beta without touching the stable auto-update
# channel. Stable clients ignore GitHub prereleases because allowPrerelease is
# left disabled in electron-updater.
on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      beta_id:
        description: "Prerelease id appended to the version (e.g. beta.3). Blank = beta.<run_number>."
        type: string
        default: ""
      dry_run:
        description: "Build Windows artifacts but skip the GitHub prerelease"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Beta Release
    runs-on: ubuntu-latest
    outputs:
      beta_version: ${{ steps.version.outputs.beta_version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute beta version from package.json
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          BETA_ID="${{ inputs.beta_id }}"
          if [ -z "$BETA_ID" ]; then
            BETA_ID="beta.${{ github.run_number }}"
          fi
          BETA_VERSION="${BASE}-${BETA_ID}"
          echo "beta_version=$BETA_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$BETA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  beta_windows:
    name: Build Windows Beta
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply beta version
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.beta_version }}"

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-windows-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/beta.yml

  publish:
    name: Publish Beta Prerelease
    needs: [prepare, beta_windows]
    if: needs.prepare.outputs.is_dry_run == 'false' && needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JingYuAI Desktop ${{ needs.prepare.outputs.tag }} (beta)
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/beta.yml
