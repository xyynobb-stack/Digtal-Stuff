name: Build macOS package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native dependencies
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}

      - name: Prepare macOS offline runtime
        env:
          EMPLOYEE_LOOKUP_ADMIN_TOKEN: ${{ secrets.EMPLOYEE_LOOKUP_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MAC_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run prepare:offline-runtime-mac

      - name: Build application
        run: npm run build

      - name: Package unsigned macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config electron-builder.mac.yml --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JingYuAI-mac-${{ matrix.arch }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
