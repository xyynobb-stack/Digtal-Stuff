name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run all build jobs but skip publish (no tag, no GitHub Release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.check.outputs.exists }}
      is_dry_run: ${{ steps.mode.outputs.is_dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: v$VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute dry-run flag
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "is_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: builds will run, publish will be skipped."
          else
            echo "is_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Real release: publish will run if tag does not exist."
          fi

  release_windows:
    name: Build Windows
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply desktop Agent overlays
        run: npm run apply:offline-runtime-overlays

      - name: Download PortableGit runtime
        run: npm run prepare:portable-git

      - name: Upgrade bundled SQLite runtime
        run: npm run prepare:sqlite-runtime

      - name: Build bundled Dashboard frontend
        shell: pwsh
        run: |
          $agentRoot = (Resolve-Path "build/offline-runtime/hermes-agent").Path
          Push-Location $agentRoot
          try {
            npm ci --workspace web
            if ($LASTEXITCODE -ne 0) { throw "Could not install Dashboard frontend dependencies" }
            npm run build --workspace web
            if ($LASTEXITCODE -ne 0) { throw "Could not build Dashboard frontend" }
          } finally {
            Pop-Location
            foreach ($dependencyRoot in @(
              (Join-Path $agentRoot "node_modules"),
              (Join-Path $agentRoot "web/node_modules")
            )) {
              if (Test-Path -LiteralPath $dependencyRoot) {
                Remove-Item -LiteralPath $dependencyRoot -Recurse -Force
              }
            }
          }
          node scripts/verify-dashboard-web-dist.mjs `
            "build/offline-runtime/hermes-agent/hermes_cli/web_dist"
          if ($LASTEXITCODE -ne 0) { throw "Dashboard frontend verification failed" }

      - name: Verify bundled Windows runtime
        shell: pwsh
        env:
          EMPLOYEE_LOOKUP_ADMIN_TOKEN: ${{ secrets.EMPLOYEE_LOOKUP_ADMIN_TOKEN }}
        run: |
          $required = @(
            "build/offline-runtime/hermes-agent/run_agent.py",
            "build/offline-runtime/hermes-agent/hermes_cli/web_dist/index.html",
            "build/offline-runtime/hermes-agent/hermes_cli/web_dist/assets",
            "build/offline-runtime/python-runtime/python.exe",
            "build/offline-runtime/python-runtime/DLLs/sqlite3.dll",
            "build/offline-runtime/python-runtime/desktop-sqlite-runtime.json",
            "build/offline-runtime/git/bin/bash.exe",
            "build/offline-runtime/git/cmd/git.exe",
            "build/offline-runtime/preset-content"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Bundled Windows runtime is incomplete: missing $path"
            }
          }

          $runtimeBytes = (Get-ChildItem "build/offline-runtime" -Recurse -File |
            Measure-Object -Property Length -Sum).Sum
          if ($runtimeBytes -lt 100MB) {
            throw "Bundled Windows runtime is unexpectedly small: $runtimeBytes bytes"
          }
          if ([string]::IsNullOrWhiteSpace($env:EMPLOYEE_LOOKUP_ADMIN_TOKEN)) {
            throw "EMPLOYEE_LOOKUP_ADMIN_TOKEN GitHub Secret is required"
          }

          $envFile = Join-Path $PWD "build/offline-runtime/employee-lookup.env"
          $content = "EMPLOYEE_LOOKUP_ADMIN_TOKEN=$($env:EMPLOYEE_LOOKUP_ADMIN_TOKEN)`n"
          [IO.File]::WriteAllText($envFile, $content, [Text.UTF8Encoding]::new($false))
          Write-Host "Verified bundled runtime: $([math]::Round($runtimeBytes / 1MB, 1)) MB"
          & "build/offline-runtime/python-runtime/python.exe" -c "import sqlite3; assert sqlite3.sqlite_version == '3.53.4', sqlite3.sqlite_version"
          if ($LASTEXITCODE -ne 0) { throw "Bundled SQLite version check failed" }

      - name: Build bundled Windows virtual environment
        shell: pwsh
        run: |
          $agentRoot = Join-Path $PWD "build/offline-runtime/hermes-agent"
          $basePython = Join-Path $PWD "build/offline-runtime/python-runtime/python.exe"
          $venvRoot = Join-Path $agentRoot "venv"
          $venvPython = Join-Path $venvRoot "Scripts/python.exe"

          & $basePython -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not create bundled Python venv" }
          & $venvPython -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Could not upgrade pip in bundled venv" }
          Push-Location $agentRoot
          try {
            & $venvPython -m pip install --disable-pip-version-check -e ".[edge-tts]"
            if ($LASTEXITCODE -ne 0) { throw "Could not install Hermes Agent into bundled venv" }
            & $venvPython -c "import hermes_cli, run_agent, edge_tts"
            if ($LASTEXITCODE -ne 0) { throw "Bundled Hermes Agent import check failed" }
            & $venvPython -c "from tui_gateway import server; required = {'model.options', 'model.identity', 'model.resolve', 'session.create', 'session.model.set', 'session.readiness'}; missing = required - server._methods.keys(); assert not missing, missing"
            if ($LASTEXITCODE -ne 0) { throw "Desktop Agent RPC registration check failed" }
            & $venvPython -c "from tui_gateway import server; route = server._desktop_route_identity({'provider':'ci-provider','model':'ci-model','base_url':'https://ci.invalid/v1'}); assert route['route_id'].startswith('route:v1:')"
            if ($LASTEXITCODE -ne 0) { throw "Desktop Agent route identity check failed" }
          } finally {
            Pop-Location
          }

      - name: Stamp packaged runtime identity
        shell: pwsh
        run: |
          $marker = [ordered]@{
            buildId = "${{ github.sha }}"
            desktopVersion = "${{ needs.prepare.outputs.version }}"
            generatedAt = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD "build/offline-runtime/desktop-runtime-build.json"),
            "$marker`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Package bundled Runtime archive
        run: npm run package:offline-runtime

      - name: Build app
        env:
          VITE_ANALYTICS_BASE_URL: ${{ vars.VITE_ANALYTICS_BASE_URL }}
          VITE_ANALYTICS_API_KEY: ${{ secrets.VITE_ANALYTICS_API_KEY }}
          MAIN_VITE_HERMES_API_URL: ${{ vars.HERMES_API_URL }}
          MAIN_VITE_HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $runtime = (Resolve-Path "dist/win-unpacked/resources/hermes-runtime").Path
          $required = @(
            "$runtime/runtime.tar",
            "$runtime/runtime-archive.json",
            "$runtime/desktop-runtime-build.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Packaged Windows runtime is incomplete: missing $path"
            }
          }
          node scripts/package-offline-runtime.mjs --verify $runtime
          if ($LASTEXITCODE -ne 0) { throw "Packaged Runtime archive verification failed" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  publish:
    name: Publish Release
    needs: [prepare, release_windows]
    if: needs.prepare.outputs.is_dry_run == 'false' && needs.prepare.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JingYuAI Desktop ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.exe.blockmap
            artifacts/latest.yml
